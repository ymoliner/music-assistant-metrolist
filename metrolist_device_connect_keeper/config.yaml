name: Metrolist Provider Keeper
slug: metrolist_device_connect_keeper
version: "1.0.0"
description: Restores the Metrolist Device Connect provider after Music Assistant container replacement
url: https://github.com/ymoliner/music-assistant-metrolist
arch:
  - aarch64
  - amd64
startup: application
boot: auto
init: false
docker_api: true
options:
  addon_container: ""
  check_interval: 30
schema:
  addon_container: str
  check_interval: int(15, 3600)
